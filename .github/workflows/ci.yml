name: CloseLoop CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Test Suite & Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Synthetic Data (10k Rows)
        run: |
          python data_gen/generate_data.py --scale 10000 --output data

      - name: Run Master Test Suite
        run: |
          python tests/run_all_tests.py

      - name: Verify Precision, Recall & KPIs
        run: |
          python tests/run_verification.py

      - name: Generate Pitch Deck PPTX
        run: |
          python docs/generate_pitch_deck.py
